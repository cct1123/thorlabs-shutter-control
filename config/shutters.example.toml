# Fictional identities. Copy to ignored shutters.local.toml and verify every field.
# Missing policy means READ ONLY. Never copy unmeasured limits into a live policy.
# A qualified policy permits explicit mode selection; KSC101 remembers modes.
# The legacy allow_persistent_mode_changes field is accepted but ignored.
[[shutters]]
name = "shutter"
channel = 0
role = "operator must establish physical beam role"
serial_number = "68000001"
firmware = ["1.0.7"]
[shutters.route]
kind = "d2xx"

# KEH3 routes require kind, host and bay; known hub_serial/hub_firmware are optional.
# They are currently
# available for docked Manual control with a reviewed load policy; external USB is read-only.
