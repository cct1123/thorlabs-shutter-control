[project]
name = "thorlabs-shutter-control"
version = "0.1.0"
description = "KSC101 shutter controller with a local Plotly Dash interface"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dash>=3.0,<5",
    "pythonnet>=3.0.5,<4; sys_platform == 'win32'",
]

[project.scripts]
shutter-control = "thorlabs_shutter_control.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
